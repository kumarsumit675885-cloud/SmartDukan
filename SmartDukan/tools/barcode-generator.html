<!doctype html>
<html lang="hi">
<head><meta charset="utf-8"><meta name="viewport"content="width=device-width,initial-scale=1"><title>Barcode - SmartDukan</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="site-header"><div class="logo">SmartDukan</div></header>
<div style="max-width:700px;margin:18px auto;background:#fff;padding:18px;border-radius:10px">
  <h2>Barcode Generator</h2>
  <input id="bcVal" placeholder="Enter code e.g. 8901234567890" />
  <div style="margin-top:8px"><button class="btn" id="gen">Generate</button><button class="btn ghost" id="download">Download</button></div>
  <div id="bcArea" style="margin-top:12px;text-align:center"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
SD.q('#gen').addEventListener('click', ()=>{
  const v = SD.q('#bcVal').value.trim(); if(!v) return alert('Enter code');
  SD.q('#bcArea').innerHTML = `<svg id="bcsvg"></svg>`;
  JsBarcode("#bcsvg", v, {format:"EAN13",displayValue:true,width:2,height:60});
});
SD.q('#download').addEventListener('click', ()=>{
  const svg = SD.q('#bcArea svg'); if(!svg) return alert('Generate first');
  const serializer = new XMLSerializer(); const source = serializer.serializeToString(svg);
  const blob = new Blob([source],{type:'image/svg+xml;charset=utf-8'}); SD.downloadBlob('barcode.svg', blob);
});
</script>
</body>
</html>
